<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiteLens · SEO Analyzer</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="header">
    <div class="header-main"><div class="logo">S</div><div class="brand"><strong>SiteLens</strong><small>SEO 工具箱</small></div></div>
    <div class="site-line">
      <div class="site-identity"><div id="site-host" class="site-host">读取当前页面…</div><div id="site-url" class="site-url"></div></div>
      <span id="site-status" class="site-status">待分析</span>
      <button id="refresh" class="icon-button" aria-label="重新分析当前网页" title="重新分析当前网页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg></button>
    </div>
  </header>
  <div class="workspace">
    <aside class="sidebar">
      <nav class="tabs" aria-label="SiteLens 功能栏目" id="tabs">
      <div class="nav-group">页面分析</div>
      <button data-tab="overview" class="active" aria-current="page" title="总览"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>总览</span></button>
      <button data-tab="issues" title="问题检查"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 10 17H2L12 3Z"/><path d="M12 9v4m0 3h.01"/></svg><span>问题检查</span></button>
      <button data-tab="headings" title="标题层级"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v14m12-14v14M4 12h12m3 7h3m-1-5v5"/></svg><span>标题层级</span></button>
      <button data-tab="density" title="关键词"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10m8 10V4m8 16v-7M2 20h20"/></svg><span>关键词</span></button>
      <button data-tab="images" title="图片"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></svg><span>图片</span></button>
      <button data-tab="links" title="链接"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 13 4-4m-6 7-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 0 1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0"/></svg><span>链接</span></button>
      <button data-tab="structured" title="结构化"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H6v6l-3 3 3 3v6h2m8-18h2v6l3 3-3 3v6h-2M11 8l-1 8m4-8-1 8"/></svg><span>结构化</span></button>
      <div class="nav-group">站点数据</div>
      <button data-tab="domain" title="域名信息"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg><span>域名信息</span></button>
      <button data-tab="sitemap" title="Sitemap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="5" rx="1"/><path d="M12 8v5m-7 4v-4h14v4"/><rect x="2" y="17" width="6" height="4" rx="1"/><rect x="16" y="17" width="6" height="4" rx="1"/></svg><span>Sitemap</span></button>
      </nav>
      <div class="sidebar-bottom"><button id="dashboard" class="dashboard-button" title="打开监控后台"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18M7 14l4-4 4 3 5-7"/></svg><span>监控后台</span></button><span class="local-label"><i></i>本地存储</span></div>
    </aside>
    <div class="workspace-main">
      <main id="content" class="content"><p class="loading">正在分析当前网页…</p></main>
      <footer class="footer"><span>本地 SEO 分析</span><span>免费 · 无付费 API</span></footer>
    </div>
  </div>
  <script src="db.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
