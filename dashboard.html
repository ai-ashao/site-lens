<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SiteLens · SEO Competitor Monitor</title><link rel="stylesheet" href="styles.css"></head>
<body class="app-body">
<div class="app-shell">
<aside class="sidebar">
<div class="side-brand"><div class="brand-mark">S</div><div><div class="brand-name">SiteLens</div><div class="muted tiny">SEO COMPETITOR MONITOR</div></div></div>
<div class="side-title">监控站点 <span id="site-count" class="count">0</span></div>
<div id="site-list" class="site-list"></div>
<div class="side-footer"><span class="online-dot"></span>本地数据 · 免费使用</div>
</aside>
<main class="workspace">
<header class="topbar"><div><div class="eyebrow">COMPETITOR INTELLIGENCE</div><h1>竞争对手监控</h1><div class="muted">观察 Sitemap 新增页面、移出 URL 与更新动作</div></div><div class="top-actions"><button id="export-all" class="button secondary">导出全部 JSON</button></div></header>
<section class="add-bar"><form id="add-form"><label for="add-domain">添加竞品域名</label><div class="input-row"><input id="add-domain" placeholder="例如 coolgamesfree.org 或 https://example.com" autocomplete="off" required><button class="button primary" type="submit">+ 添加监控</button></div></form><div class="muted tiny">支持 robots.txt / Sitemap Index / XML / Gzip；每日自动扫描要求浏览器运行</div></section>
<section class="stats-grid" id="global-stats"></section>
<section class="detail-section"><div id="detail-content"></div></section>
</main></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="db.js"></script><script src="dashboard.js"></script></body></html>
